<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact</title>
    <link rel="stylesheet" href="css/contact.css">
</head>

<body>
    <header>
        <nav id="nav" class="nav">
            <div class="logo" id="logo">Elite Designs</div>
            <div class="navitems" id="navitems">
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="explore.html">Explore</a></li>
                    <li><a href="contact.html" class="active">Contact Us</a></li>
                    <button onclick="location.href='/upload.html'" class="uploadbtn">Get Started</button>
                </ul>
            </div>
            <div class="dropdown">
                <button class="drop-down"></button>
                <div class="dropdown-content">
                    <a href="#"><span id="user-details">User</span></a>
                    <a href="#" id="logout-link">Logout</a>
                </div>
            </div>
            <div class="hamburger" id="hamburger">&#9776;</div>
        </nav>
    </header>
    <div class="container">
        <form id="contact-form" action="/contact" method="post" class="feedback">
            <h2>Contact Us</h2>
            <input type="text" name="firstname" id="firstname" placeholder="First Name" required>
            <input type="text" name="lastname" id="lastname" placeholder="Last Name" required>
            <input type="email" name="email" id="email" placeholder="Email">
            <input type="text" name="mobile" id="mobile" placeholder="Mobile">
            <h4>Share Your Thoughts</h4>
            <textarea name="concern" id="concern" required></textarea>
            <input type="submit" value="Send" id="button">
        </form>
    </div>
    <script>

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('/user-details', {
                    method: 'GET',
                    credentials: 'include'
                });
                const data = await response.json();

                if (data.isLoggedIn) {
                    document.getElementById('user-details').textContent = `Welcome, ${data.username}!`;
                } else {
                    window.location.href = '/login.html';
                }
            } catch (error) {
                console.error('Error fetching user details:', error);
                window.location.href = '/login.html';
            }
        });

        const hamburger = document.getElementById('hamburger');
        const navitems = document.getElementById('navitems');

        hamburger.addEventListener('click', () => {
            navitems.querySelector('ul').classList.toggle('show');
        });

        document.getElementById('contact-form').addEventListener('submit', async function (event) {
            event.preventDefault();

            // Collect form data
            const formData = new FormData(this);

            try {
                const response = await fetch('/contact', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    alert(result.message);
                    this.reset();
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred while submitting the form.');
            }
        });
        document.getElementById("logout-link").addEventListener("click", async () => {
            try {
                await fetch("/logout", { method: "POST" });
                window.location.href = "/login.html";
            } catch (error) {
                console.error("Error logging out:", error);
            }
        });
    </script>

</body>

</html>
